<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="It is a program that use CRUD to manipulte products."
    />
    <meta
      name="keywords"
      content="products, price, create, read, update, delete."
    />
    <meta
      name="sitedomain"
      content="https://github.com/giselle-01/interaction_servers"
    />
    <meta name="organization" content="giselle-01" />
    <meta name="author" content="Giselle Andrea Palencia Toro" />
    <meta name="designer" content="Giselle Andrea Palencia Toro" />
    <meta name="copyright" content="© 2025 giselle-01. All rights reserved" />
    <meta name="robots" content="index,follow" />
    <meta name="googlebot" content="index,follow" />
    <meta name="revisit-after" content="15days" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="stylesheet" href="./src/css/styles.css" />
    <script type="module" src="./src/js/main.js" defer></script>
    <title>Interaction Server</title>
  </head>
  <body>
    <header>
      <h1>Sistema Interactivo</h1>
    </header>

    <main>
      <section>
        <div>
          <h3>Datos del producto</h3>
          <form id="form" class="row g-3 needs-validation p-2" novalidate>

          <div class="mb-3">
            <label for="name_product" class="form-label">Nombre del producto</label>
            <input type="text" class="form-control" id="name_product" placeholder="Escriba el nombre de su producto"
              required />
            <div class="invalid-feedback">Este campo es obligatorio</div>
          </div>

          <div class="mb-3">
            <label for="price_product" class="form-label">Precio del producto</label>
            <input type="text" class="form-control" id="price_product" placeholder="Escribe el precio de su producto" required />
            <div class="invalid-feedback">Este campo es obligatorio</div>
          </div>

          <div class="mb-3">
            <label for="description" class="form-label">Descripción del producto</label>
            <textarea class="form-control" id="description" rows="3" required></textarea>
          </div>

          <button class="btn" type="submit" id="btnSave">
            Guardar
          </button>
        </form>
        </div>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
